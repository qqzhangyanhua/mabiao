# 跨平台打包并上传到 GitHub Releases（draft）。
# 触发：推送 v* tag，或 Actions 页手动 Run workflow。
# 需要仓库 Settings → Actions → Workflow permissions 勾选 Read and write。

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create one draft GitHub Release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          TAG="v${VERSION}"
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name==\"${TAG}\" and .draft==true)][0].id // empty")
          if [ -z "$ID" ]; then
            ID=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="码表 v${VERSION}" \
              -f target_commitish="${GITHUB_SHA}" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            artifact: linux-x64
          - platform: windows-latest
            args: ""
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v__VERSION__
          releaseName: 码表 v__VERSION__
          releaseBody: |
            从下方 Assets 下载对应平台安装包。

            | 平台 | 建议下载 |
            |------|----------|
            | macOS Apple Silicon | `aarch64-apple-darwin` 的 `.dmg` |
            | macOS Intel | `x86_64-apple-darwin` 的 `.dmg` |
            | Linux x64 | `.deb` 或 AppImage |
            | Windows x64 | NSIS `.exe` |

            当前构建未做 Apple / Windows 代码签名。macOS 若提示无法验证开发者，在访达中右键打开；Windows 若被 SmartScreen 拦截，选择仍要运行。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          retryAttempts: 3
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      - name: Upload bundle artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
