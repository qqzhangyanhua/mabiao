name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release 流水线打包前复用同一套检查，避免两处命令漂移。
  workflow_call:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # 不写 version：package.json 已经用 packageManager 钉住了 pnpm@9.15.0，
        # 两处同时指定会让 action-setup 直接以 "Multiple versions of pnpm specified" 失败。
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        # jsdom 30 依赖 undici 8，加载时调用 worker_threads.markAsUncloneable。
        # Node 20 没有这个 API，hooks 的 forks worker 起不来，整次测试以 exit 1 结束。
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只卡生产依赖的 high/critical。dev 依赖（vitest、eslint 传递包）
      # 的 advisory 不阻断 CI。暂时无法升级的 CVE 写进
      # package.json → pnpm.auditConfig.ignoreCves，并在旁边注明原因。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  backend:
    name: Backend (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Tauri Linux deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  shared-crates:
    name: crates/${{ matrix.crate }} (fmt + clippy + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [push-protocol, pricing]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }}

      - name: Check formatting
        run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path crates/${{ matrix.crate }}/Cargo.toml

  server:
    name: server (fmt + clippy + test + docker build)
    runs-on: ubuntu-latest
    services:
      # 测试连真 PostgreSQL；sqlx::test 为每个测试建一个临时库，所以用超级用户。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --manifest-path server/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path server/Cargo.toml

      # 部署物只在 CI 里验证：确保 Dockerfile 在干净环境里能构建。
      - name: Docker build
        run: docker build -f server/Dockerfile -t mabiao-server:ci .

  server-web:
    name: server web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # 默认只把 vulnerability 当失败；unmaintained / unsound / yanked
      # 保持 warning，避免 gtk / unic-* 一类上游告警把 CI 打成红。
      # 若某条 advisory 暂时无法在不升 major 的前提下修复，把 ID 写进
      # src-tauri/audit.toml 的 [advisories] ignore，并注明原因。
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
