[package]
name = "mabiao"
version = "0.1.1"
description = "码表：本机 AI 用量统计"
authors = ["zhangyanhua"]
license = "MIT"
edition = "2021"
default-run = "mabiao"

[lib]
name = "mabiao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mabiao-quota"
path = "src/bin/quota.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "litellm_snapshot"
path = "src/bin/litellm_snapshot.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
dirs = "6"
rfd = "0.17.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tauri-plugin-notification = "2.3.3"
ureq = { version = "2", default-features = false, features = ["json", "tls", "socks-proxy"] }
aes-gcm = "0.10"

[dev-dependencies]
tempfile = "3"
